<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Boutique - Modèle Clair</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fc;color:#1a2540}
header{background:#1d4ed8;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:20px}
#cartBtn{background:#fff;color:#1d4ed8;border:0;border-radius:20px;padding:8px 14px;font-weight:bold;font-size:15px}
.hero{background:linear-gradient(135deg,#1d4ed8,#38bdf8);color:#fff;padding:36px 16px;text-align:center}
.hero h2{font-size:24px;margin-bottom:8px}
.hero p{opacity:.9}
.bar{display:flex;gap:8px;overflow-x:auto;padding:14px 12px}
.bar button{border:1px solid #1d4ed8;background:#fff;color:#1d4ed8;border-radius:18px;padding:7px 14px;white-space:nowrap}
.bar button.on{background:#1d4ed8;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px 24px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(29,78,216,.1)}
.img{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;background:#e0ecff}
.info{padding:10px}
.info h3{font-size:14px;margin-bottom:4px}
.price{color:#1d4ed8;font-weight:bold;margin-bottom:8px}
.add{width:100%;background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:9px;font-size:14px}
#panel{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100%;background:#fff;z-index:10;transition:right .3s;display:flex;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.2)}
#panel.open{right:0}
.ph{background:#1d4ed8;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.ph button{background:none;border:0;color:#fff;font-size:22px}
#items{flex:1;overflow-y:auto;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e5eaf5;font-size:14px}
.qty button{width:28px;height:28px;border:1px solid #1d4ed8;background:#fff;color:#1d4ed8;border-radius:50%;font-size:16px}
.qty span{margin:0 8px}
.pf{padding:14px;border-top:1px solid #e5eaf5}
.pf input{width:100%;padding:10px;border:1px solid #c5d3ee;border-radius:8px;margin-bottom:8px;font-size:15px}
.total{font-weight:bold;font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between}
#send{width:100%;background:#16a34a;color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:bold}
.empty{text-align:center;color:#7a88a8;margin-top:40px}
footer{text-align:center;padding:20px;color:#7a88a8;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🛍️ Ma Boutique</h1>
<button id="cartBtn" onclick="toggle()">Panier (<span id="count">0</span>)</button>
</header>
<div class="hero">
<h2>Vos articles préférés, livrés chez vous</h2>
<p>Commandez en quelques clics sur WhatsApp</p>
</div>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<footer>Modèle de démonstration - Boutique en ligne</footer>

<div id="panel">
<div class="ph"><strong>Mon panier</strong><button onclick="toggle()">✕</button></div>
<div id="items"></div>
<div class="pf">
<input id="nom" placeholder="Votre nom">
<input id="lieu" placeholder="Quartier / lieu de livraison">
<div class="total"><span>Total</span><span id="total">0 FCFA</span></div>
<button id="send" onclick="commander()">Commander sur WhatsApp</button>
</div>
</div>

<script>
// 1) Changez ce numéro (format international, sans + ni espaces)
var WHATSAPP = "2250000000000";
// 2) Changez vos articles ici
var produits = [
{id:1,nom:"Chemise élégante",prix:8000,cat:"Vêtements",e:"👕"},
{id:2,nom:"Pantalon classe",prix:12000,cat:"Vêtements",e:"👖"},
{id:3,nom:"Robe d'été",prix:15000,cat:"Vêtements",e:"👗"},
{id:4,nom:"Baskets sport",prix:20000,cat:"Chaussures",e:"👟"},
{id:5,nom:"Sandales",prix:6000,cat:"Chaussures",e:"🩴"},
{id:6,nom:"Casquette",prix:3000,cat:"Accessoires",e:"🧢"},
{id:7,nom:"Sac à main",prix:10000,cat:"Accessoires",e:"👜"},
{id:8,nom:"Montre",prix:18000,cat:"Accessoires",e:"⌚"}
];
var panier = {};
var filtre = "Tout";

function fcfa(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")+" FCFA";}

function barre(){
  var cats = ["Tout"];
  produits.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat);});
  document.getElementById("bar").innerHTML = cats.map(function(c){
    return '<button class="'+(c===filtre?"on":"")+'" onclick="setF(\''+c+'\')">'+c+'</button>';
  }).join("");
}
function setF(c){filtre=c;barre();grille();}

function grille(){
  var l = produits.filter(function(p){return filtre==="Tout"||p.cat===filtre;});
  document.getElementById("grid").innerHTML = l.map(function(p){
    return '<div class="card"><div class="img">'+p.e+'</div><div class="info"><h3>'+p.nom+'</h3><div class="price">'+fcfa(p.prix)+'</div><button class="add" onclick="ajouter('+p.id+')">Ajouter</button></div></div>';
  }).join("");
}

function ajouter(id){panier[id]=(panier[id]||0)+1;maj();}
function chg(id,d){panier[id]=(panier[id]||0)+d;if(panier[id]<=0)delete panier[id];maj();}

function maj(){
  var ids = Object.keys(panier), n = 0, t = 0, h = "";
  ids.forEach(function(id){
    var p = produits.filter(function(x){return x.id==id;})[0];
    var q = panier[id]; n += q; t += p.prix*q;
    h += '<div class="row"><div>'+p.e+' '+p.nom+'<br><small>'+fcfa(p.prix*q)+'</small></div><div class="qty"><button onclick="chg('+id+',-1)">-</button><span>'+q+'</span><button onclick="chg('+id+',1)">+</button></div></div>';
  });
  document.getElementById("items").innerHTML = h || '<div class="empty">Votre panier est vide</div>';
  document.getElementById("count").textContent = n;
  document.getElementById("total").textContent = fcfa(t);
}

function toggle(){document.getElementById("panel").classList.toggle("open");}

function commander(){
  var ids = Object.keys(panier);
  if(!ids.length){alert("Votre panier est vide");return;}
  var nom = document.getElementById("nom").value.trim();
  var lieu = document.getElementById("lieu").value.trim();
  if(!nom||!lieu){alert("Indiquez votre nom et votre lieu de livraison");return;}
  var m = "Bonjour, je souhaite commander :\n", t = 0;
  ids.forEach(function(id){
    var p = produits.filter(function(x){return x.id==id;})[0];
    m += "- "+p.nom+" x"+panier[id]+" = "+fcfa(p.prix*panier[id])+"\n";
    t += p.prix*panier[id];
  });
  m += "\nTotal : "+fcfa(t)+"\nNom : "+nom+"\nLivraison : "+lieu;
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m),"_blank");
}

barre();grille();maj();
</script>
</body>
  </html>
