<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique</title>
<style>
:root{--c:#1d4ed8;--c2:#38bdf8;--bg:#f4f7fc;--t:#1a2540}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--c);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:20px;display:flex;align-items:center;gap:8px}
#logo img{height:32px;display:block}
#cartBtn{background:#fff;color:var(--c);border:0;border-radius:20px;padding:8px 14px;font-weight:bold;font-size:15px}
.hero{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:44px 16px;text-align:center}
.hero h2{font-size:26px;margin-bottom:10px}
.hero p{opacity:.92;margin-bottom:18px}
.cta{display:inline-block;background:#fff;color:var(--c);text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:24px}
.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 12px}
.adv div{background:#fff;border-radius:12px;padding:12px 6px;text-align:center;font-size:12px;box-shadow:0 2px 8px rgba(29,78,216,.08)}
.adv b{display:block;font-size:24px;margin-bottom:4px}
h2.t{padding:10px 14px 6px;font-size:20px}
.search{padding:0 12px 4px}
.search input{width:100%;padding:12px 14px;border:1px solid #c5d3ee;border-radius:24px;font-size:15px}
.bar{display:flex;gap:8px;overflow-x:auto;padding:12px}
.bar button{border:1px solid var(--c);background:#fff;color:var(--c);border-radius:18px;padding:7px 14px;white-space:nowrap}
.bar button.on{background:var(--c);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px 24px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(29,78,216,.1);position:relative}
.img{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;background:#e0ecff}
.badge{position:absolute;top:8px;left:8px;background:#ef4444;color:#fff;font-size:11px;font-weight:bold;padding:3px 8px;border-radius:10px}
.info{padding:10px}
.info h3{font-size:14px;margin-bottom:4px}
.price{color:var(--c);font-weight:bold;margin-bottom:8px}
.add{width:100%;background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px;font-size:14px}
.none{grid-column:1/-1;text-align:center;color:#7a88a8;padding:30px}
.avis{display:grid;gap:10px;padding:0 12px 20px}
.avis div{background:#fff;border-radius:12px;padding:14px;font-size:14px;box-shadow:0 2px 8px rgba(29,78,216,.08)}
.avis b{display:block;margin-top:6px;color:var(--c);font-size:13px}
.contact{background:#e0ecff;text-align:center;padding:26px 16px}
.contact p{margin:6px 0}
.wa{display:inline-block;margin-top:12px;background:#16a34a;color:#fff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:24px}
footer{text-align:center;padding:18px;color:#7a88a8;font-size:13px}
#fab{position:fixed;bottom:18px;left:16px;width:54px;height:54px;border-radius:50%;background:#16a34a;color:#fff;font-size:28px;text-decoration:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:4}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1a2540;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
#panel{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100%;background:#fff;z-index:10;transition:right .3s;display:flex;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.2)}
#panel.open{right:0}
.ph{background:var(--c);color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.ph button{background:none;border:0;color:#fff;font-size:22px}
#items{flex:1;overflow-y:auto;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e5eaf5;font-size:14px}
.qty button{width:28px;height:28px;border:1px solid var(--c);background:#fff;color:var(--c);border-radius:50%;font-size:16px}
.qty span{margin:0 8px}
.pf{padding:14px;border-top:1px solid #e5eaf5}
.pf input{width:100%;padding:10px;border:1px solid #c5d3ee;border-radius:8px;margin-bottom:8px;font-size:15px}
.total{font-weight:bold;font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between}
#send{width:100%;background:#16a34a;color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:bold}
.empty{text-align:center;color:#7a88a8;margin-top:40px}
</style>
</head>
<body>
<header>
<h1><span id="logo"></span><span id="nomB"></span></h1>
<button id="cartBtn" onclick="toggle()">Panier (<span id="count">0</span>)</button>
</header>

<div class="hero">
<h2 id="tAcc"></h2>
<p id="tSous"></p>
<a class="cta" id="tBtn" href="#catalogue"></a>
</div>

<div class="adv">
<div><b>🚚</b><span id="lRap"></span></div>
<div><b>💳</b><span id="lPay"></span></div>
<div><b>⭐</b><span id="lGar"></span></div>
</div>

<h2 class="t" id="catalogue"></h2>
<div class="search"><input id="q" placeholder="🔍 Rechercher un article..." oninput="grille()"></div>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>

<h2 class="t" id="tAvis"></h2>
<div class="avis" id="avis"></div>

<div class="contact">
<h2 id="tCont"></h2>
<p>📍 <span id="lieuB"></span></p>
<p id="mailB"></p>
<p id="tMsg"></p>
<a class="wa" id="waLink" href="#" target="_blank">💬 Discuter sur WhatsApp</a>
</div>
<footer>© <span id="nomF"></span></footer>

<a id="fab" href="#" target="_blank">💬</a>
<div id="toast">Ajouté au panier ✓</div>

<div id="panel">
<div class="ph"><strong>Mon panier</strong><button onclick="toggle()">✕</button></div>
<div id="items"></div>
<div class="pf">
<input id="nom" placeholder="Votre nom">
<input id="lieu" placeholder="Quartier / lieu de livraison">
<div class="total"><span>Total</span><span id="total"></span></div>
<button id="send" onclick="commander()">Commander sur WhatsApp</button>
</div>
</div>

<script src="config.js"></script>
<script>
var C = window.CONFIG;
if(!C){document.body.innerHTML='<p style="padding:20px">Erreur : le fichier config.js est introuvable.</p>';throw new Error("config");}
var produits = C.produits, DEV = C.devise || "FCFA", T = C.textes, L = C.livraison;
var panier = {}, filtre = "Tout", cats = ["Tout"];

function $(id){return document.getElementById(id);}
function fcfa(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")+" "+DEV;}
function trouve(id){return produits.filter(function(x){return x.id==id;})[0];}

function appliquer(){
  var r = document.documentElement.style, k = C.couleurs || {};
  if(k.principale) r.setProperty("--c",k.principale);
  if(k.secondaire) r.setProperty("--c2",k.secondaire);
  if(k.fond) r.setProperty("--bg",k.fond);
  document.title = C.nom;
  if(C.logo){$("logo").innerHTML='<img src="'+C.logo+'" alt="">';}else{$("logo").textContent=C.icone;}
  $("nomB").textContent = C.nom; $("nomF").textContent = C.nom;
  $("tAcc").textContent = T.accroche; $("tSous").textContent = T.sousTitre; $("tBtn").textContent = T.bouton;
  $("lRap").textContent = L.rapide; $("lPay").textContent = L.paiement; $("lGar").textContent = L.garantie;
  $("catalogue").textContent = T.titreCatalogue; $("tAvis").textContent = T.titreAvis;
  $("tCont").textContent = T.titreContact; $("tMsg").textContent = T.messageContact;
  $("lieuB").textContent = C.lieu;
  if(C.email){$("mailB").textContent = "✉️ "+C.email;}
  var lien = "https://wa.me/"+C.whatsapp;
  $("waLink").href = lien; $("fab").href = lien;
  $("avis").innerHTML = (C.avis||[]).map(function(a){
    var s = ""; for(var i=0;i<a.etoiles;i++){s += "⭐";}
    return '<div>'+s+'<br>'+a.texte+'<b>'+a.auteur+'</b></div>';
  }).join("");
  produits.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat);});
}

function barre(){
  $("bar").innerHTML = cats.map(function(c,i){
    return '<button class="'+(c===filtre?"on":"")+'" onclick="setF('+i+')">'+c+'</button>';
  }).join("");
}
function setF(i){filtre=cats[i];barre();grille();}

function grille(){
  var mot = $("q").value.toLowerCase().trim();
  var l = produits.filter(function(p){
    return (filtre==="Tout"||p.cat===filtre) && p.nom.toLowerCase().indexOf(mot)>=0;
  });
  $("grid").innerHTML = l.length ? l.map(function(p){
    return '<div class="card">'+(p.b?'<span class="badge">'+p.b+'</span>':'')+'<div class="img">'+p.e+'</div><div class="info"><h3>'+p.nom+'</h3><div class="price">'+fcfa(p.prix)+'</div><button class="add" onclick="ajouter('+p.id+')">Ajouter</button></div></div>';
  }).join("") : '<div class="none">Aucun article trouvé</div>';
}

function ajouter(id){
  panier[id]=(panier[id]||0)+1;maj();
  var t=$("toast");t.classList.add("on");
  setTimeout(function(){t.classList.remove("on");},1200);
}
function chg(id,d){panier[id]=(panier[id]||0)+d;if(panier[id]<=0)delete panier[id];maj();}

function maj(){
  var ids = Object.keys(panier), n = 0, t = 0, h = "";
  ids.forEach(function(id){
    var p = trouve(id), q = panier[id];
    n += q; t += p.prix*q;
    h += '<div class="row"><div>'+p.e+' '+p.nom+'<br><small>'+fcfa(p.prix*q)+'</small></div><div class="qty"><button onclick="chg('+id+',-1)">-</button><span>'+q+'</span><button onclick="chg('+id+',1)">+</button></div></div>';
  });
  $("items").innerHTML = h || '<div class="empty">Votre panier est vide</div>';
  $("count").textContent = n;
  $("total").textContent = fcfa(t);
}

function toggle(){$("panel").classList.toggle("open");}

function commander(){
  var ids = Object.keys(panier);
  if(!ids.length){alert("Votre panier est vide");return;}
  var nom = $("nom").value.trim(), lieu = $("lieu").value.trim();
  if(!nom||!lieu){alert("Indiquez votre nom et votre lieu de livraison");return;}
  var m = "Bonjour, je souhaite commander :\n", t = 0;
  ids.forEach(function(id){
    var p = trouve(id);
    m += "- "+p.nom+" x"+panier[id]+" = "+fcfa(p.prix*panier[id])+"\n";
    t += p.prix*panier[id];
  });
  m += "\nTotal : "+fcfa(t)+"\nNom : "+nom+"\nLivraison : "+lieu;
  window.open("https://wa.me/"+C.whatsapp+"?text="+encodeURIComponent(m),"_blank");
}

appliquer();barre();grille();maj();
</script>
</body>
                                                                    </html>
